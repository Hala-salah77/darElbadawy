<div class="page-wrapper">
  <app-header></app-header>
  
  <main class="main-content">
    <!-- Hero Section -->
    <section class="page-hero">
      <div class="hero-bg" style="background-image: url('assets/images/cover3.jpg');"></div>
      <div class="hero-overlay"></div>
      <div class="container hero-content">
        <h1 class="page-title">{{ t('heroTitle') }}</h1>
        <p class="page-sub">{{ t('heroSub') }}</p>
      </div>
    </section>

    <section class="contact-section section">
      <div class="container">
        <div class="contact-grid">
          
          <!-- Contact Info -->
          <div class="contact-info-panel">
            <h2 class="panel-title">{{ t('contactInfo') }}</h2>
            
            <div class="contact-item">
              <div class="icon-box"><i class="fas fa-map-marker-alt"></i></div>
              <div class="item-details">
                <h3>{{ t('addressLabel') }}</h3>
                <p>{{ t('address') }}</p>
              </div>
            </div>

            <div class="contact-item">
              <div class="icon-box"><i class="fab fa-whatsapp"></i></div>
              <div class="item-details">
                <h3>{{ t('phoneLabel') }}</h3>
                <p>
                  <a href="https://wa.me/201234567890" target="_blank">+20 123 456 7890</a>
                </p>
              </div>
            </div>

            <div class="contact-item">
              <div class="icon-box"><i class="fas fa-envelope"></i></div>
              <div class="item-details">
                <h3>{{ t('emailLabel') }}</h3>
                <p>
                  <a href="mailto:hello@darelbadawi.com">{{ t('email') }}</a>
                </p>
              </div>
            </div>

            <!-- Social Links -->
            <div class="social-box">
              <h3>{{ t('socialLabel') }}</h3>
              <div class="social-links">
                <a href="https://www.instagram.com/bedouin.dar/" target="_blank" class="instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.youtube.com/@AFIFYWASHERE" target="_blank" class="youtube"><i class="fab fa-youtube"></i></a>
              </div>
            </div>
            
          </div>
          
          <!-- Map or Image -->
          <div class="contact-visual">
            <div class="map-wrapper">
              <!-- Using iframe for real google maps since it's a contact page -->
              <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d111000!2d34.4!3d28.5!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x15ab5c7777777777%3A0x7777777777777777!2sDahab%2C%20South%20Sinai%20Governorate%2C%20Egypt!5e0!3m2!1sen!2sus!4v1704123456789!5m2!1sen!2sus" 
                width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
            <a href="https://wa.me/201234567890?text=I'd like to book!" target="_blank" class="btn btn-amber btn-xl w-100 mt-4 justify-content-center">
              <i class="fab fa-whatsapp"></i>
              {{ t('sendWa') }}
            </a>
          </div>

        </div>
      </div>
    </section>
  </main>
  
  <app-footer></app-footer>
</div>
