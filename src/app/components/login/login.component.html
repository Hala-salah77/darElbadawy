<div class="login-page" [attr.dir]="lang === 'ar' ? 'rtl' : 'ltr'">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>{{ t('title') }}</h1>
        <p>{{ t('sub') }}</p>
      </div>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="email">{{ t('emailLabel') }}</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope icon"></i>
            <input
              type="email"
              id="email"
              formControlName="email"
              class="form-input"
              [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
              [placeholder]="t('emailPlaceholder')"
            >
          </div>
          <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">{{ t('errorReqUser') }}</span>
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">{{ t('passLabel') }}</label>
          <div class="input-wrapper">
            <i class="fas fa-lock icon"></i>
            <input
              type="password"
              id="password"
              formControlName="password"
              class="form-input"
              [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
              [placeholder]="t('passPlaceholder')"
            >
          </div>
          <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">{{ t('errorReqPass') }}</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">{{ t('errorReqPass') }}</span>
          </div>
        </div>
        
        <div class="global-error" *ngIf="errorMessage">
          <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
        </div>
        
        <button
          type="submit"
          class="login-btn btn btn-amber w-100"
          [disabled]="loginForm.invalid || isLoading"
        >
          <span *ngIf="!isLoading">{{ t('btnAction') }}</span>
          <span *ngIf="isLoading" class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            {{ t('btnLoading') }}
          </span>
        </button>
      </form>
      
      <div class="login-footer">
        <a routerLink="/" class="back-link">
          <i class="fas fa-arrow-left"></i>
          {{ t('backBtn') }}
        </a>
      </div>
    </div>
  </div>
</div>
